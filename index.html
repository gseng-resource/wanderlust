<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderlust</title>
<meta property="og:title" content="Wanderlust">
<meta property="og:description" content="Travel guides and trip research.">
<meta property="og:url" content="https://gseng-resource.github.io/wanderlust/">
<style>
  :root { --bg: #f6f4ef; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e1d9; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --card: #1f1f22; --text: #f2f2f3; --muted: #a1a1a8; --line: #2e2e33; --accent: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
  a.card { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; color: inherit;
           background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
  a.card:hover { border-color: var(--accent); }
  .t { font-weight: 600; }
  .s { color: var(--muted); font-size: .92rem; }
  .lang { float: right; font-size: .9rem; color: var(--muted); margin-top: 10px; }
  .lang a { color: var(--accent); text-decoration: none; }
  .lang b { color: var(--text); }
  a.card .ic { width:56px; height:56px; flex:none; border-radius:10px; object-fit:cover; background:var(--line); }
  a.card > div { flex:1; }
  .chev { color: var(--muted); font-size: 1.4rem; }
</style>
</head>
<body>
<main>
  <span class="lang"><b>EN</b> | <a href="index.zh.html" lang="zh-Hans">中文</a></span>
  <h1>Wanderlust</h1>
  <p class="lede">Travel guides and trip research.</p>

  <h2>Japan</h2>
  <a class="card" href="japan/oita-road-trip.html">
    <img class="ic" src="assets/thumbs/oita-usuki-buddhas.jpg" alt="">
    <div><div class="t">Oita Road Trip</div><div class="s">Yufuin, Kunisaki, Beppu and Usuki by car from Fukuoka</div></div>
    <span class="chev">›</span>
  </a>
  <a class="card" href="japan/okinawa-winter.html">
    <img class="ic" src="assets/thumbs/oki-kouri-bridge.jpg" alt="">
    <div><div class="t">Okinawa in Winter</div><div class="s">Blue Cave snorkel, Churaumi, Shuri Castle and Okinawan food</div></div>
    <span class="chev">›</span>
  </a>
<p class="muted" style="margin-top:32px;font-size:.9rem;color:var(--muted)"><a href="about.html">About this research</a>: sources, how prices and budgets are worked out, and check dates.</p>
</main>
</body>
</html>
