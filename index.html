<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderlust</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #f6f4ef; --text: #1d1d1f; --muted: #6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141416; --text: #f2f2f3; --muted: #a1a1a8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; text-align: center; }
  p { color: var(--muted); margin: 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Wanderlust</h1>
  <p>Coming soon.</p>
</main>
</body>
</html>
